apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:2.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: TODOS_PATH
              value: "/todos"
            - name: MAX_BODY_BYTES
              value: "4096"
            - name: TODO_MAX_LENGTH
              value: "140"
            - name: PGHOST
              value: todo-postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: todo
            - name: PGDATABASE
              value: todo
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-postgres-auth
                  key: password
            - name: INITIAL_TODOS
              valueFrom:
                configMapKeyRef:
                  name: todo-initial-data
                  key: todos.json
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  namespace: project
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
    - port: 80
      targetPort: 3000