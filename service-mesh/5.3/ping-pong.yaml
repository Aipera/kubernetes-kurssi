apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
        version: v1
    spec:
      containers:
      - name: ping-pong
        image: ping-pong:5.3
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PGHOST
          value: ping-pong-postgres
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: pingpong
        - name: PGDATABASE
          value: pingpong
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: ping-pong-postgres-auth
              key: password
        readinessProbe:
          httpGet:
            path: /pongs
            port: http
          periodSeconds: 5
          timeoutSeconds: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ping-pong
  namespace: exercises
spec:
  selector:
    app: ping-pong
  ports:
  - name: http
    appProtocol: http
    port: 80
    targetPort: http
