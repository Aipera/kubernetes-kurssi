apiVersion: v1
kind: Service
metadata:
  name: greeter-svc
  namespace: exercises
spec:
  selector:
    app: greeter
  ports:
  - name: http
    appProtocol: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v1
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
      - name: greeter
        image: greeter:5.3
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GREETER_VERSION
          value: v1
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 6
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 6
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-1
  namespace: exercises
spec:
  selector:
    app: greeter
    version: v1
  ports:
  - name: http
    appProtocol: http
    port: 80
    targetPort: http
