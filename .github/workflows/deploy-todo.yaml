name: Build Todo for GitOps

on:
  push:
    branches: [main]
    paths:
      - todo-app/**
      - todo-backend/**
      - broadcaster/**
      - gke/todo.yaml
      - gke/todo-db-backup.yaml
      - gke/release-todo-images.sh
      - kustomization.yaml
      - .github/workflows/deploy-todo.yaml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: todo-gitops-main
  queue: max

env:
  GKE_PROJECT_ID: project-e08f1dba-8ab7-491a-90a
  GAR_HOST: europe-north1-docker.pkg.dev
  GAR_REPOSITORY: kurssi

jobs:
  build-publish:
    if: ${{ github.ref == 'refs/heads/main' && github.event.deleted != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: '5.8.1'

      - name: Check JavaScript syntax
        run: |
          node --check todo-app/app.js
          node --check todo-backend/app.js
          node --check broadcaster/app.js

      - name: Build images
        run: |
          image_root="$GAR_HOST/$GKE_PROJECT_ID/$GAR_REPOSITORY"
          todo_app_image="$image_root/todo-app:$GITHUB_SHA"
          todo_backend_image="$image_root/todo-backend:$GITHUB_SHA"
          broadcaster_image="$image_root/broadcaster:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$todo_app_image" todo-app
          docker build --platform linux/amd64 -t "$todo_backend_image" todo-backend
          docker build --platform linux/amd64 -t "$broadcaster_image" broadcaster
          printf 'TODO_APP_IMAGE=%s\nTODO_BACKEND_IMAGE=%s\nBROADCASTER_IMAGE=%s\n' "$todo_app_image" "$todo_backend_image" "$broadcaster_image" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GKE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Publish images
        run: |
          gcloud auth configure-docker "$GAR_HOST" --quiet
          docker push "$TODO_APP_IMAGE"
          docker push "$TODO_BACKEND_IMAGE"
          docker push "$BROADCASTER_IMAGE"

      - name: Commit image versions for Argo CD
        run: bash gke/release-todo-images.sh
