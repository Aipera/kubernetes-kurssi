name: Build Todo for GitOps

on:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: todo-gitops-environments
  queue: max

env:
  GKE_PROJECT_ID: project-e08f1dba-8ab7-491a-90a
  GAR_HOST: europe-north1-docker.pkg.dev
  GAR_REPOSITORY: kurssi

jobs:
  build-publish:
    if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.event.deleted != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check configuration repository access
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          if [[ -z "$CONFIG_REPO_TOKEN" ]]; then
            echo 'Add CONFIG_REPO_TOKEN: a fine-grained token for Aipera/kubernetes-kurssi-config with Contents read/write.' >&2
            exit 1
          fi

      - name: Check out configuration repository
        uses: actions/checkout@v6
        with:
          repository: Aipera/kubernetes-kurssi-config
          ref: main
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config-repository
          fetch-depth: 0

      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: '5.8.1'

      - name: Check JavaScript syntax
        run: |
          node --check todo-app/app.js
          node --check todo-backend/app.js
          node --check broadcaster/app.js

      - name: Validate environments
        run: |
          kustomize build config-repository/overlays/staging >/dev/null
          kustomize build config-repository/overlays/production >/dev/null
          kustomize build config-repository/gitops/todo-apps >/dev/null

      - name: Build images
        run: |
          image_root="$GAR_HOST/$GKE_PROJECT_ID/$GAR_REPOSITORY"
          release_sha="$(git rev-parse HEAD)"
          todo_app_image="$image_root/todo-app:$release_sha"
          todo_backend_image="$image_root/todo-backend:$release_sha"
          broadcaster_image="$image_root/broadcaster:$release_sha"
          docker build --platform linux/amd64 -t "$todo_app_image" todo-app
          docker build --platform linux/amd64 -t "$todo_backend_image" todo-backend
          docker build --platform linux/amd64 -t "$broadcaster_image" broadcaster
          printf 'TODO_RELEASE_SHA=%s\nTODO_APP_IMAGE=%s\nTODO_BACKEND_IMAGE=%s\nBROADCASTER_IMAGE=%s\n' "$release_sha" "$todo_app_image" "$todo_backend_image" "$broadcaster_image" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GKE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Publish images
        run: |
          gcloud auth configure-docker "$GAR_HOST" --quiet
          docker push "$TODO_APP_IMAGE"
          docker push "$TODO_BACKEND_IMAGE"
          docker push "$BROADCASTER_IMAGE"

      - name: Publish release to configuration repository
        run: bash gke/release-todo-images.sh
