apiVersion: v1
kind: PersistentVolume
metadata:
  name: ping-pong-pv
spec:
  capacity:
    storage: 64Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/lib/kurssi/ping-pong
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-kurssi-network-server-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ping-pong-pvc
spec:
  storageClassName: ""
  volumeName: ping-pong-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi