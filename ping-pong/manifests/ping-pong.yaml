apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:1.11
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: ping-pong-data
              mountPath: /persistent
      volumes:
        - name: ping-pong-data
          persistentVolumeClaim:
            claimName: ping-pong-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ping-pong
spec:
  selector:
    app: ping-pong
  ports:
    - port: 80
      targetPort: 3000