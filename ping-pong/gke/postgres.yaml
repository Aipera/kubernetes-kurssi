apiVersion: v1
kind: Service
metadata:
  name: ping-pong-postgres
  namespace: exercises
spec:
  clusterIP: None
  selector:
    app: ping-pong-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ping-pong-postgres
  namespace: exercises
spec:
  serviceName: ping-pong-postgres
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-postgres
  template:
    metadata:
      labels:
        app: ping-pong-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: pingpong
            - name: POSTGRES_DB
              value: pingpong
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ping-pong-postgres-auth
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "pingpong", "-d", "pingpong"]
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi