apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-environments
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Aipera/kubernetes-kurssi.git
    targetRevision: main
    path: gitops/todo-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
