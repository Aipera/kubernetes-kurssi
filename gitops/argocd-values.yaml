# Course cluster with one node. Helm chart argo/argo-cd 10.18.1.
# CPU requests are zero because existing workloads reserve most of the node.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

configs:
  cm:
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 30s

controller:
  resources:
    requests: {cpu: '0', memory: 128Mi}
    limits: {cpu: 500m, memory: 768Mi}
repoServer:
  resources:
    requests: {cpu: '0', memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi}
server:
  service:
    type: ClusterIP
  resources:
    requests: {cpu: '0', memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
redis:
  resources:
    requests: {cpu: '0', memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
redisSecretInit:
  resources:
    requests: {cpu: '0', memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
