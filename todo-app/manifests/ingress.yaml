apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: todo-app
                port:
                  number: 80
          - path: /image.jpg
            pathType: Exact
            backend:
              service:
                name: todo-app
                port:
                  number: 80