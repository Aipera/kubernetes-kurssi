apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-output
  namespace: exercises
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /log
            pathType: Exact
            backend:
              service:
                name: log-output
                port:
                  number: 80
          - path: /pingpong
            pathType: Exact
            backend:
              service:
                name: ping-pong
                port:
                  number: 80