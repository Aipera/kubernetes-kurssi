apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
      containers:
        - name: writer
          image: log-output:1.10
          imagePullPolicy: IfNotPresent
          command: ["node", "writer.js"]
          volumeMounts:
            - name: shared-logs
              mountPath: /shared
        - name: reader
          image: log-output:1.10
          imagePullPolicy: IfNotPresent
          command: ["node", "app.js"]
          volumeMounts:
            - name: shared-logs
              mountPath: /shared
              readOnly: true