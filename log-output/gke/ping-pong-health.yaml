apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: ping-pong-health
  namespace: exercises
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 3000
        requestPath: /pongs
  targetRef:
    group: ""
    kind: Service
    name: ping-pong-gateway