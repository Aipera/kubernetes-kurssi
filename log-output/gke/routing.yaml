apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: exercise-http
  namespace: exercises
spec:
  healthCheck:
    type: HTTP
    requestPath: /
    port: 3000
    checkIntervalSec: 10
    timeoutSec: 5
---
apiVersion: v1
kind: Service
metadata:
  name: log-output
  namespace: exercises
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"ports":{"80":"exercise-http"}}'
spec:
  type: ClusterIP
  selector:
    app: log-output
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exercises-ingress
  namespace: exercises
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - http:
        paths:
          - path: /pingpong
            pathType: Exact
            backend:
              service:
                name: ping-pong
                port:
                  number: 80
          - path: /log
            pathType: Exact
            backend:
              service:
                name: log-output
                port:
                  number: 80