apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummysite-controller
  namespace: dummysite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dummysite-controller
  template:
    metadata:
      labels:
        app: dummysite-controller
    spec:
      serviceAccountName: dummysite-controller
      containers:
        - name: controller
          image: europe-north1-docker.pkg.dev/project-e08f1dba-8ab7-491a-90a/kurssi/dummysite-controller:5.1
          imagePullPolicy: Always
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WEBSITE_IMAGE
              value: nginx:alpine
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: '0'
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
