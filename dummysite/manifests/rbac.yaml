apiVersion: v1
kind: ServiceAccount
metadata:
  name: dummysite-controller
  namespace: dummysite
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dummysite-controller
  namespace: dummysite
rules:
  - apiGroups: [stable.dwk]
    resources: [dummysites]
    verbs: [get, list, watch]
  - apiGroups: [stable.dwk]
    resources: [dummysites/status]
    verbs: [patch]
  - apiGroups: ['']
    resources: [configmaps, services]
    verbs: [get, create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dummysite-controller
  namespace: dummysite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dummysite-controller
subjects:
  - kind: ServiceAccount
    name: dummysite-controller
    namespace: dummysite
