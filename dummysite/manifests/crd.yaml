apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dummysites.stable.dwk
spec:
  group: stable.dwk
  scope: Namespaced
  names:
    kind: DummySite
    plural: dummysites
    singular: dummysite
    shortNames: [dsite]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [website_url]
              properties:
                website_url:
                  type: string
                  pattern: '^https?://'
                  minLength: 8
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                serviceName:
                  type: string
                deploymentName:
                  type: string
                configMapName:
                  type: string
                sourceUrl:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.website_url
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Service
          type: string
          jsonPath: .status.serviceName
