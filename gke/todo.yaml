apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-image-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-initial-data
data:
  todos.json: |
    [
      "Opettele Kubernetesin perusteet",
      "Vie sovellus klusteriin",
      "Ota käyttöön pysyvä tallennustila"
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: todo-postgres
spec:
  clusterIP: None
  selector:
    app: todo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: todo-postgres
spec:
  serviceName: todo-postgres
  replicas: 1
  selector:
    matchLabels:
      app: todo-postgres
  template:
    metadata:
      labels:
        app: todo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: todo
            - name: POSTGRES_DB
              value: todo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-postgres-auth
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "todo", "-d", "todo"]
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: todo-backend-health
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 3000
        requestPath: /todos
  targetRef:
    group: ""
    kind: Service
    name: todo-backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-route
spec:
  parentRefs:
    - name: exercises-gateway
      namespace: exercises
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /todos
      backendRefs:
        - name: todo-backend
          port: 80
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /image.jpg
      backendRefs:
        - name: todo-app
          port: 80